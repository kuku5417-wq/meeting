<html lang="ko">

<body>
{# 사이드바 없는 최소 화면 — DB 를 열지 못한 상태에서도 뜬다(NAS 연결 화면, 단계 5).
   새 CSS 를 더하지 않고 app.css 에 있는 클래스만 쓴다(디자인 규칙: 토큰·기존 컴포넌트). #}
<div class="wrap">
  <main>
